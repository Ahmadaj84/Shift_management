# Render Blueprint: https://render.com/docs/blueprint-spec
# New > Blueprint > pick this GitHub repo. Render builds and redeploys on every push.
services:
  - type: web
    name: ecg-shift-management
    runtime: node
    # A persistent disk (for the JSON database) needs a paid instance type.
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "false"
      # You are asked for this when creating the Blueprint. It is the first
      # admin password (username: admin); change it later in "My Account".
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: ecg-data
      mountPath: /var/data
      sizeGB: 1
